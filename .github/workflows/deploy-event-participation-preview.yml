name: Deploy event-participation to Supabase Preview
# Preview-only deployment; the job checks out the current Preview branch head.

on:
  push:
    branches:
      - security/trusted-gameplay-migration
    paths:
      - 'supabase/functions/event-participation/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-event-participation-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/security/trusted-gameplay-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Preview branch
        uses: actions/checkout@v4
        with:
          ref: security/trusted-gameplay-migration

      - name: Set up Deno for verification tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test event verification helpers
        run: deno test supabase/functions/_shared/event-verification.test.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy event-participation to Preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Required Supabase GitHub secret or variable is missing."
            exit 1
          fi
          supabase functions deploy event-participation --project-ref "$SUPABASE_PROJECT_REF" --yes
