name: Deploy player-expeditions to Supabase Preview
# Preview-only deployment; the job checks out the current Preview branch head.

on:
  push:
    branches:
      - security/trusted-gameplay-migration
    paths:
      - 'supabase/functions/player-expeditions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/security/trusted-gameplay-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Preview branch
        uses: actions/checkout@v4
        with:
          ref: security/trusted-gameplay-migration

      - name: Set up Deno for type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check player Expeditions function
        run: deno check --no-config supabase/functions/player-expeditions/index.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy player-expeditions to Preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Required Supabase GitHub secret or variable is missing."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "lchkctclxzwwvfwosava" ]; then
            echo "Refusing deployment: this workflow is Preview-only and must target lchkctclxzwwvfwosava."
            exit 1
          fi
          supabase functions deploy player-expeditions --project-ref "$SUPABASE_PROJECT_REF" --yes
