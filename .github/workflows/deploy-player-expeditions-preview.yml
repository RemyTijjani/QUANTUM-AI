name: Deploy player-expeditions to Supabase Preview
# Preview-only deployment; the job checks out the current Preview branch head.

on:
  push:
    branches:
      - security/trusted-gameplay-migration
    paths:
      - 'supabase/functions/player-expeditions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-player-expeditions-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/security/trusted-gameplay-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Preview branch
        uses: actions/checkout@v4
        with:
          ref: security/trusted-gameplay-migration

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy player-expeditions to Preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Required Supabase GitHub secret or variable is missing."
            exit 1
          fi
          supabase functions deploy player-expeditions --project-ref "$SUPABASE_PROJECT_REF" --yes
