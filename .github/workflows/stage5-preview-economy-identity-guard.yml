name: Stage 5 Preview - Reject caller-supplied economy identity

on:
  push:
    branches:
      - security/trusted-gameplay-migration
    paths:
      - ".github/workflows/stage5-preview-economy-identity-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-unverified-identity:
    name: Reject unverified token even when a player ID is supplied (Preview)
    runs-on: ubuntu-latest
    steps:
      - name: Call Preview player-economy with an invalid token and arbitrary player ID
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status_file="$(mktemp)"
          curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request GET "https://lchkctclxzwwvfwosava.supabase.co/functions/v1/player-economy?player_id=00000000-0000-0000-0000-000000000000" --header 'Authorization: Bearer stage5-invalid-test-token' > "$status_file"
          status="$(cat "$status_file")"
          rm -f "$status_file"
          echo "HTTP status: $status"
          echo "Response:"
          cat "$response_file"
          if [ "$status" != "401" ]; then
            rm -f "$response_file"
            echo "::error::Expected HTTP 401 for an invalid bearer token; received $status"
            exit 1
          fi
          rm -f "$response_file"
          echo "PASS: Preview player-economy rejected an invalid token despite a caller-supplied player ID."
