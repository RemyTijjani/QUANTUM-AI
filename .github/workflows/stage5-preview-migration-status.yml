name: Stage 5 Preview Migration Status (Read Only)

on:
  workflow_dispatch:
  push:
    branches:
      - security/trusted-gameplay-migration
    paths:
      - .github/workflows/stage5-preview-migration-status.yml
      - supabase/migrations/**

permissions:
  contents: read

jobs:
  inspect-preview-migrations:
    if: github.ref == 'refs/heads/security/trusted-gameplay-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 5 security branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Validate Preview-only credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PREVIEW_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN, SUPABASE_PREVIEW_PROJECT_REF, or SUPABASE_DB_PASSWORD."
            exit 1
          fi
          echo "Credentials are present. Target is the Preview project secret."

      - name: Link only the Preview project
        env:
          PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: List local versus Preview migration history (read only)
        run: |
          echo "Running read-only migration list against the linked Preview project."
          echo "This workflow does not run db push, migration repair, migration up, or SQL writes."
          supabase migration list --linked
