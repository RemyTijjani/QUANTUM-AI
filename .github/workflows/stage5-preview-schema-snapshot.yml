name: Stage 5 Preview Schema Snapshot (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-preview-schema:
    if: github.ref == 'refs/heads/security/trusted-gameplay-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 5 security branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Validate Preview-only credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PREVIEW_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing Preview credentials. No database connection was made."
            exit 1
          fi
          echo "Preview credentials are present."

      - name: Link only the Preview project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Export public schema only (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db dump --linked --schema public --file preview-schema.sql
          test -s preview-schema.sql
          echo "Schema export completed. No migrations or SQL writes were run."

      - name: Upload Preview schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-public-schema
          path: preview-schema.sql
          if-no-files-found: error
          retention-days: 7
