name: Stage 5 Preview Security - Player Economy and Admin Authentication

on:
  push:
    branches:
      - security/trusted-gameplay-migration
    paths:
      - ".github/workflows/stage5-preview-unauthenticated-economy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unauthenticated-player-economy:
    name: Reject unauthenticated economy reads (Preview)
    runs-on: ubuntu-latest
    steps:
      - name: Call Preview player-economy without credentials
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request GET "https://lchkctclxzwwvfwosava.supabase.co/functions/v1/player-economy")"
          echo "HTTP status: $status"
          echo "Response:"
          cat "$response_file"
          rm -f "$response_file"
          if [ "$status" != "401" ]; then
            echo "::error::Expected HTTP 401 for an unauthenticated request; received $status"
            exit 1
          fi
          echo "PASS: Preview player-economy rejected the unauthenticated request."

  invalid-admin-credentials:
    name: Reject invalid admin credentials (Preview)
    runs-on: ubuntu-latest
    steps:
      - name: Call Preview admin-api with invalid credentials
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://lchkctclxzwwvfwosava.supabase.co/functions/v1/admin-api" --header "Content-Type: application/json" --data '{"action":"fetch_dashboard","adminUsername":"stage5-invalid-user","adminPassword":"stage5-invalid-password"}')"
          echo "HTTP status: $status"
          echo "Response:"
          cat "$response_file"
          if [ "$status" != "401" ]; then
            rm -f "$response_file"
            echo "::error::Expected HTTP 401 for invalid admin credentials; received $status"
            exit 1
          fi
          if ! grep -q '"error":"Unauthorized"' "$response_file"; then
            rm -f "$response_file"
            echo "::error::Expected the admin-api Unauthorized response."
            exit 1
          fi
          rm -f "$response_file"
          echo "PASS: Preview admin-api rejected invalid admin credentials."
