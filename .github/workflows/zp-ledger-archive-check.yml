name: ZP ledger archive validation

on:
  pull_request:
    paths:
      - "supabase/functions/history-archive/**"
      - ".github/workflows/zp-ledger-archive-check.yml"
  push:
    branches:
      - feature/zp-ledger-batch-archive
    paths:
      - "supabase/functions/history-archive/**"
      - ".github/workflows/zp-ledger-archive-check.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check history archive Edge Function
        run: deno check supabase/functions/history-archive/index.ts
